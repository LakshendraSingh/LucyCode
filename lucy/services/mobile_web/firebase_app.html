<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lucy Workstation Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #090d16;
  --surface: #131b2e;
  --surface-alt: #1a243d;
  --border: #263352;
  --text: #f0f4fc;
  --text-dim: #8ba2c9;
  --accent: #4f8cf6;
  --accent-glow: rgba(79, 140, 246, 0.25);
  --success: #2ecc71;
  --error: #e74c3c;
  --warning: #f39c12;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 80px;
}
/* Header */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.2px;
}
.badge-online {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  background: rgba(46, 204, 113, 0.15);
  color: var(--success);
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
}
/* Setup Card */
.config-banner {
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px;
  display: none;
}
.config-banner.active { display: block; }
.input-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
input, button {
  font-family: inherit;
  font-size: 14px;
  border-radius: 8px;
}
input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  flex: 1;
}
input:focus { outline: none; border-color: var(--accent); }
button {
  background: var(--accent);
  color: #fff;
  border: none;
  font-weight: 600;
  padding: 10px 16px;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:active { opacity: 0.8; }
/* Quick Actions */
.section-title {
  font-size: 12px;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 700;
  letter-spacing: 0.8px;
  padding: 18px 18px 8px;
}
.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 0 18px;
}
.action-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  text-align: left;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-btn:active { background: var(--surface-alt); }
/* Live Terminal Command Feed */
.terminal-card {
  margin: 14px 18px;
  background: #000;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  font-family: var(--mono);
  font-size: 12px;
  max-height: 200px;
  overflow-y: auto;
  color: #a6e22e;
}
.terminal-card pre { white-space: pre-wrap; word-break: break-all; }
/* Alerts Stream */
.alerts-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 18px;
}
.alert-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 12px 14px;
}
.alert-card.success { border-left-color: var(--success); }
.alert-card.error { border-left-color: var(--error); }
.alert-card.warning { border-left-color: var(--warning); }
.alert-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.alert-title { font-weight: 700; font-size: 14px; }
.alert-time { font-size: 11px; color: var(--text-dim); }
.alert-msg { font-size: 13px; color: var(--text-dim); line-height: 1.4; }
/* Bottom Command Bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  z-index: 100;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span>🪐</span>
    <span>Lucy Remote</span>
  </div>
  <div class="badge-online">
    <span class="dot" id="onlineDot"></span>
    <span id="workstationLabel">Workstation</span>
  </div>
</header>

<div class="config-banner" id="configBanner">
  <div style="font-size: 13px; color: var(--text-dim);">Firebase Realtime Database URL:</div>
  <div class="input-row">
    <input type="text" id="dbUrlInput" placeholder="https://my-app.firebaseio.com">
    <button onclick="saveConfig()">Connect</button>
  </div>
</div>

<div class="section-title">Quick Actions</div>
<div class="quick-grid">
  <button class="action-btn" onclick="sendCommand('git status')"><span>⚡</span> Git Status</button>
  <button class="action-btn" onclick="sendCommand('pytest tests/')"><span>🧪</span> Run Tests</button>
  <button class="action-btn" onclick="sendCommand('/automate screenshot')"><span>📸</span> Screenshot</button>
  <button class="action-btn" onclick="sendCommand('/status')"><span>📊</span> Machine Stats</button>
</div>

<div class="section-title">Last Command Output</div>
<div class="terminal-card">
  <pre id="terminalOutput">// Waiting for command dispatch...</pre>
</div>

<div class="section-title">Live Mobile Alerts</div>
<div class="alerts-list" id="alertsList">
  <div class="alert-card info">
    <div class="alert-header">
      <span class="alert-title">Connected to Remote Gateway</span>
      <span class="alert-time">Just now</span>
    </div>
    <div class="alert-msg">Real-time bi-directional workstation bridge is listening.</div>
  </div>
</div>

<div class="bottom-bar">
  <input type="text" id="cmdInput" placeholder="Enter shell or /slash command..." onkeypress="if(event.key==='Enter') sendInput()">
  <button onclick="sendInput()">Send</button>
</div>

<script>
let DB_URL = "";
let WS_ID = "workstation";
const params = new URLSearchParams(window.location.search);

if (params.get("db")) {
  DB_URL = params.get("db").replace(/\/$/, "");
  localStorage.setItem("lucy_db_url", DB_URL);
} else {
  DB_URL = localStorage.getItem("lucy_db_url") || "";
}

if (params.get("ws")) {
  WS_ID = params.get("ws");
  localStorage.setItem("lucy_ws_id", WS_ID);
} else {
  WS_ID = localStorage.getItem("lucy_ws_id") || "workstation";
}

document.getElementById("workstationLabel").innerText = WS_ID;

if (!DB_URL) {
  document.getElementById("configBanner").classList.add("active");
} else {
  startPolling();
}

function saveConfig() {
  const url = document.getElementById("dbUrlInput").value.trim().replace(/\/$/, "");
  if (url) {
    DB_URL = url;
    localStorage.setItem("lucy_db_url", DB_URL);
    document.getElementById("configBanner").classList.remove("active");
    startPolling();
  }
}

async function sendCommand(cmdText) {
  if (!DB_URL) {
    alert("Please configure your Firebase Database URL first.");
    return;
  }
  const cmdId = "cmd_" + Date.now();
  const payload = {
    command: cmdText,
    source: "phone",
    timestamp: Date.now() / 1000,
    status: "pending"
  };
  document.getElementById("terminalOutput").innerText = `> ${cmdText}\n[Dispatched to workstation...]`;
  
  try {
    const res = await fetch(`${DB_URL}/workstations/${WS_ID}/commands/${cmdId}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    pollResult(cmdId);
  } catch (e) {
    document.getElementById("terminalOutput").innerText = `Error sending command: ${e}`;
  }
}

function sendInput() {
  const input = document.getElementById("cmdInput");
  const val = input.value.trim();
  if (val) {
    sendCommand(val);
    input.value = "";
  }
}

async function pollResult(cmdId) {
  let attempts = 0;
  const interval = setInterval(async () => {
    attempts++;
    if (attempts > 30) clearInterval(interval);
    try {
      const res = await fetch(`${DB_URL}/workstations/${WS_ID}/results/${cmdId}.json`);
      const data = await res.json();
      if (data && data.output !== undefined) {
        document.getElementById("terminalOutput").innerText = `Exit Code: ${data.exit_code}\n\n${data.output}`;
        clearInterval(interval);
      }
    } catch (e) {}
  }, 1000);
}

async function fetchAlerts() {
  if (!DB_URL) return;
  try {
    const res = await fetch(`${DB_URL}/workstations/${WS_ID}/alerts.json`);
    const data = await res.json();
    if (data && typeof data === "object") {
      const list = document.getElementById("alertsList");
      list.innerHTML = "";
      const alerts = Object.values(data).sort((a,b) => b.timestamp - a.timestamp);
      alerts.slice(0, 15).forEach(a => {
        const div = document.createElement("div");
        div.className = `alert-card ${a.alert_type || 'info'}`;
        const timeStr = new Date(a.timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        div.innerHTML = `
          <div class="alert-header">
            <span class="alert-title">${a.title}</span>
            <span class="alert-time">${timeStr}</span>
          </div>
          <div class="alert-msg">${a.message}</div>
        `;
        list.appendChild(div);
      });
    }
  } catch (e) {}
}

function startPolling() {
  fetchAlerts();
  setInterval(fetchAlerts, 3000);
}
</script>
</body>
</html>
