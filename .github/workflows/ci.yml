name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run test suite
        run: |
          python tests/test_sandbox.py
          python tests/test_skills.py
          python tests/test_enhanced_mcp_amplifiers.py
          python tests/test_goal_engine.py
          python tests/test_providers.py
          python tests/test_workstation_automation.py
          python tests/test_harness.py
          python tests/test_recursive_harness.py
          python tests/test_firebase_bridge.py
          python tests/test_presentation.py
          python tests/test_revert.py
          python tests/test_lucy.py
